<!doctype html>
<html lang="es">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#4552d5" />
  <title>Arrow Learn · Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f5fc;
      color: #24264e;
      font:
        16px/1.65 system-ui,
        sans-serif;
    }
    main {
      margin: 24px;
      padding: 36px;
      max-width: 400px;
      text-align: center;
      background: white;
      border: 1px solid #e4e1f2;
      border-radius: 28px;
    }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 64px;
      height: 64px;
      background: #4552d5;
      border-radius: 20px;
      color: white;
      font-size: 44px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      color: #646982;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      background: #4552d5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #aa6d16;
      outline-offset: 4px;
    }
  </style>
  <main>
    <span class="mark" aria-hidden="true">↗</span>
    <h1>Un pequeño descanso</h1>
    <p>
      Necesitas conexión para abrir esta página. Vuelve a intentarlo cuando
      estés en línea.
    </p>
    <button onclick="location.reload()">Volver a intentar</button>
  </main>
  <script>
    const locale = location.pathname.split("/")[1];
    const text = {
      ca: [
        "Una petita pausa",
        "Necessites connexió per obrir aquesta pàgina. Torna-ho a provar quan tinguis connexió.",
        "Torna-ho a provar",
      ],
      en: [
        "A little learning break",
        "You need a connection to open this page. Try again when you’re back online.",
        "Try again",
      ],
    }[locale];
    if (text) {
      document.documentElement.lang = locale;
      document.querySelector("h1").textContent = text[0];
      document.querySelector("p").textContent = text[1];
      document.querySelector("button").textContent = text[2];
    }
  </script>
</html>
